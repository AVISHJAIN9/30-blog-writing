services:
  - type: web
    name: aj-blog-writing
    runtime: node
    plan: free
    autoDeploy: true
    rootDir: BlogPlatform-Clean-Project/backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 10000
      - key: MONGO_URL
        sync: false
      - key: JWT_SECRET
        sync: false
